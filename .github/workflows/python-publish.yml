name: Upload Python Package

on:
  push:
    tags:
      - "v*"

# Default permissions are intentionally minimal.
permissions:
  contents: read

jobs:
  release-build:
    name: Build release distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build release distributions
        run: |
          python -m build

      - name: Check distributions
        run: |
          python -m twine check dist/*

      - name: Upload release distributions
        uses: actions/upload-artifact@v6
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error

  pypi-publish:
    name: Test PyPI environment
    runs-on: ubuntu-latest

    # Required for PyPI Trusted Publishing / OIDC.
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/project/flowhound/

    steps:
      - name: Verify PyPI environment
        run: |
          echo "PyPI publishing job started successfully."
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref name: ${{ github.ref_name }}"
          echo "SHA: ${{ github.sha }}"
