[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowhound"
version = "1.0.0"
description = "Automated Langflow Exploitation Platform"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Richard Howe", email = "richard.howe@ibm.com" }
]
keywords = ["security", "network"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests==2.32.3",
    "click==8.1.8",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pre-commit",
    "ruff",
    "vulture",
    "codespell",
    "pyright",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.14",
]

[project.urls]
Homepage = "https://github.com/rmhowe425/FlowHound"

[project.scripts]
flowhound = "flowhound.__main__:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"flowhound" = ["config.env", "vulnerabilities/io/*.json"]
